// firefox.cfg — exports the Google session cookie set for gemini-web2api.
//
// Installed by gemini-web2api (see firefox-autoconfig/ in the repo).
// Runs inside Firefox at every startup (AutoConfig). Writes the current
// google.com cookie set to the target file so the service always has a fresh
// session without any external process reading browser data (ESET blocks
// that) and without DevTools/automation flags (Gemini notices those).
//
// Disable: delete this file and defaults/pref/autoconfig.js from the Firefox
// install directory.
(function () {
  var DEFAULT_TARGET = "G:\\cli\\gemini-web2api\\cookie.txt";
  var AUTH_USER = 1;          // Google account index (/u/N) for the Pro account
  var TIMER_MS = 5 * 60 * 1000;

  function resolveTarget() {
    var t = DEFAULT_TARGET;
    try { t = Services.prefs.getStringPref("hermes.cookieSync.target", DEFAULT_TARGET); } catch (e) {}
    return t;
  }

  function mark(k, v) { try { Services.prefs.setStringPref("hermes.cookieSync." + k, String(v).slice(0, 300)); } catch (e) {} }
  function writeAll(path, text) {
    var file = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
    file.initWithPath(path);
    var fos = Components.classes["@mozilla.org/network/file-output-stream;1"].createInstance(Components.interfaces.nsIFileOutputStream);
    fos.init(file, 0x02 | 0x08 | 0x20, 438, 0);
    fos.write(text, text.length);
    fos.close();
  }

  var lastJson = "";

  function collect() {
    var arr = Services.cookies.cookies || [];
    var pairs = {}, order = [], sapisid = "";
    for (var i = 0; i < arr.length; i++) {
      var c = arr[i];
      var host = String(c.host || "");
      if (host.indexOf("google.com") < 0) continue;
      var name = String(c.name || "");
      var value = String(c.value || "");
      if (!name || !value || Object.prototype.hasOwnProperty.call(pairs, name)) continue;
      pairs[name] = value;
      order.push(name);
      if (name === "SAPISID") sapisid = value;
    }
    var parts = [];
    for (var j = 0; j < order.length; j++) parts.push(order[j] + "=" + pairs[order[j]]);
    return {
      cookie: parts.join("; "),
      sapisid: sapisid,
      count: order.length,
      hasSession: !!(pairs["SID"] && pairs["__Secure-1PSID"]),
    };
  }

  function dump(tag) {
    try {
      var snap = collect();
      if (!snap.hasSession) { mark("last", tag + " skip (no session), google=" + snap.count); return; }
      var payload = {
        cookie: snap.cookie,
        sapisid: snap.sapisid,
        auth_user: AUTH_USER,
        exported: new Date().toISOString(),
        source: "firefox-autoconfig",
      };
      var json = JSON.stringify(payload, null, 1);
      if (json === lastJson) { mark("last", tag + " unchanged n=" + snap.count); return; }
      lastJson = json;

      var target = resolveTarget();
      var tmpPath = target + ".fftmp";
      writeAll(tmpPath, json);
      try {
        var tmpFile = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
        tmpFile.initWithPath(tmpPath);
        var destFile = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
        destFile.initWithPath(target);
        if (destFile.exists()) destFile.remove(false);
        tmpFile.moveTo(destFile.parent, destFile.leafName);
      } catch (eMove) {
        writeAll(target, json); // fallback: direct write
      }
      mark("last", tag + " wrote n=" + snap.count + " bytes=" + json.length + " -> " + target);
    } catch (e) { mark("err", tag + ": " + (e.message || e)); }
  }

  mark("installed", "yes");
  dump("startup");

  try { Services.obs.addObserver({ observe: function () { dump("cookie-changed"); } }, "cookie-changed"); } catch (e1) {}
  try { Services.obs.addObserver({ observe: function () { dump("ui-ready"); } }, "browser-delayed-startup-finished"); } catch (e2) {}
  try { Services.obs.addObserver({ observe: function () { dump("quit"); } }, "quit-application"); } catch (e3) {}

  try {
    var timer = Components.classes["@mozilla.org/timer;1"].createInstance(Components.interfaces.nsITimer);
    timer.initWithCallback({ notify: function () { dump("timer"); } }, TIMER_MS, Components.interfaces.nsITimer.TYPE_REPEATING_SLACK);
  } catch (e4) { mark("timerErr", e4.message); }
})();
